{% extends "base.html" %}
{% block title %}Iniciar Sesión - Agencia de Envíos{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 65vh;">
    <div class="card" style="width: 100%; max-width: 420px; border-top: 4px solid var(--accent); padding: 40px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="{{ url_for('static', filename='logoazul.PNG') }}" alt="Logo BJJ" style="max-width: 200px; margin-bottom: 2px;">
            <h1 style="font-family: 'Syne', sans-serif; color: var(--accent); margin-bottom: 8px; font-size: 24px;">ENVÍOS BJJ</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Sistema de Gestión de Paquetería</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label>Usuario</label>
                <div style="position: relative;">
                    <i class="fas fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" name="username" class="form-control" style="padding-left: 40px;" placeholder="Tu usuario" required autofocus>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label>Contraseña</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="password" name="password" class="form-control" style="padding-left: 40px;" placeholder="Tu contraseña" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 16px;">
                <i class="fas fa-sign-in-alt"></i> Ingresar
            </button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('rastreo.index') }}" class="btn btn-secondary" style="width: 100%; justify-content: center; padding: 10px;">
                <i class="fas fa-search"></i> Rastrear un Paquete Público
            </a>
        </div>
    </div>
</div>
{% endblock %}
