<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Agencia de Envíos</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0d0d14;
            --surface: #16161f;
            --border: #2a2a3a;
            --accent: #3D5BA0;
            --text: #e8e8f0;
            --text-muted: #888899;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(233,69,96,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(99,102,241,0.06) 0%, transparent 50%);
            pointer-events: none;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px;
            width: 400px;
            position: relative;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #f5a623);
            border-radius: 16px 16px 0 0;
        }
        .brand { text-align: center; margin-bottom: 36px; }
        .brand-icon {
            width: 56px; height: 56px;
            background: rgba(233,69,96,0.15);
            border: 1px solid rgba(233,69,96,0.3);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 24px; color: var(--accent);
        }
        .brand h1 {
            font-family: 'Syne', sans-serif;
            font-size: 24px; font-weight: 800;
        }
        .brand h1 span { color: var(--accent); }
        .brand p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted); font-size: 14px;
        }
        input {
            width: 100%; padding: 12px 14px 12px 40px;
            background: #1e1e2a; border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-size: 14px;
            font-family: 'DM Sans', sans-serif; outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }
        .btn-login {
            width: 100%; padding: 13px;
            background: var(--accent); color: white;
            border: none; border-radius: 8px;
            font-size: 15px; font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer; transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover { background: #d63651; }
        .alert {
            padding: 12px 16px; border-radius: 8px;
            background: rgba(233,69,96,0.1);
            border: 1px solid rgba(233,69,96,0.3);
            color: var(--accent); font-size: 14px;
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 8px;
        }
        .hint {
            margin-top: 24px; padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center; font-size: 12px; color: var(--text-muted);
        }
        .hint code {
            background: #1e1e2a; padding: 2px 6px; border-radius: 4px;
            color: var(--accent); font-size: 12px;
        }
        .login-card img {
            width: 100%;
            max-width: 180px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="">
        <h1>ENVÍOS<span>BJJ</span></h1>
        <p>Sistema de Gestión de Paquetería</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert"><i class="fas fa-exclamation-circle"></i> {{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label>Usuario</label>
            <div class="input-wrap">
                <i class="fas fa-user"></i>
                <input type="text" name="username" placeholder="Tu usuario" required autofocus>
            </div>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Tu contraseña" required>
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i> Ingresar
        </button>
    </form>
    <div class="hint">
        Acceso inicial: usuario <code>admin</code> / contraseña <code>admin123</code>
    </div>
    <div style="margin-top: 20px; text-align: center;">
        <a href="{{ url_for('rastreo.index') }}" style="color: var(--accent); text-decoration: none; font-weight: 500; font-size: 14px; padding: 10px 20px; border: 1px solid var(--accent); border-radius: 8px; display: inline-block; transition: 0.2s;">
            <i class="fas fa-search"></i> Rastrear un Paquete
        </a>
    </div>
</div>
</body>
</html>
