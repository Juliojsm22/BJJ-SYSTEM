{% extends "base.html" %}
{% block title %}Restablecer Contraseña - BJJ SYSTEM{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 65vh;">
    <div class="card" style="width: 100%; max-width: 420px; border-top: 4px solid var(--accent); padding: 40px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-family: 'Syne', sans-serif; color: var(--accent); margin-bottom: 8px; font-size: 24px;">
                Nueva Contraseña</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Ingresa tu nueva contraseña a continuación.</p>
        </div>

        <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label>Nueva Contraseña</label>
                <div style="position: relative;">
                    <i class="fas fa-lock"
                        style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="password" name="password" class="form-control" style="padding-left: 40px;"
                        placeholder="Contraseña nueva" required autofocus minlength="6">
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label>Confirmar Contraseña</label>
                <div style="position: relative;">
                    <i class="fas fa-lock"
                        style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="password" name="confirm_password" class="form-control" style="padding-left: 40px;"
                        placeholder="Confirma la contraseña" required minlength="6">
                </div>
            </div>
            <button type="submit" class="btn btn-primary"
                style="width: 100%; justify-content: center; padding: 12px; font-size: 16px;">
                <i class="fas fa-save"></i> Guardar y Entrar
            </button>
        </form>
    </div>
</div>
{% endblock %}
