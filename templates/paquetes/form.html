{% extends "base.html" %}
{% block title %}Editar Paquete{% endblock %}
{% block page_title %}Editar Paquete{% endblock %}

{% block topbar_actions %}
<a href="{{ url_for('paquetes.index') }}" class="btn btn-secondary">
    <i class="fas fa-arrow-left"></i> Volver
</a>
{% endblock %}

{% block content %}
<div style="max-width:640px;">
    <div class="card">
        <form method="POST" id="formPaquete">
            <div class="form-group">
                <label>Cliente *</label>
                <select name="cliente_id" class="form-control" required>
                    <option value="">Seleccionar cliente...</option>
                    {% for c in clientes %}
                    <option value="{{ c.id }}" {% if paquete.cliente_id == c.id %}selected{% endif %}>
                        {{ c.nombre_completo }} — {{ c.cedula }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Nombre del paquete *</label>
                <input type="text" name="nombre" class="form-control"
                       value="{{ paquete.nombre }}" required
                       placeholder="Ej: Ropa deportiva, Electrónico, etc.">
            </div>
            <div class="form-group">
                <label>Número de Seguimiento *</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" name="numero_seguimiento" class="form-control"
                           value="{{ paquete.numero_seguimiento }}"
                           placeholder="Ej: 1Z9999999999999999" required>
                    <button type="button" class="btn btn-secondary" title="Escanear con cámara" onclick="abrirScanner(this.previousElementSibling)" style="padding: 10px 14px;">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion" class="form-control" placeholder="Descripción del contenido...">{{ paquete.descripcion }}</textarea>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>Peso (libras) *</label>
                    <input type="number" name="peso" id="peso" class="form-control"
                           value="{{ paquete.peso }}"
                           step="0.01" min="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Tipo de envío *</label>
                    <select name="tipo_envio" id="tipo_envio" class="form-control" required>
                        <option value="">Seleccionar...</option>
                        <option id="opt_aereo" value="aereo" {% if paquete.tipo_envio == 'aereo' %}selected{% endif %}>✈️ Aéreo — $6.50/lb</option>
                        <option id="opt_maritimo" value="maritimo" {% if paquete.tipo_envio == 'maritimo' %}selected{% endif %}>🚢 Marítimo — $2.50/lb</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Estado de Rastreo</label>
                <select name="estado_rastreo" class="form-control">
                    <option value="bodega_miami" {% if paquete.estado_rastreo == 'bodega_miami' %}selected{% endif %}>🏢 En bodega Miami</option>
                    <option value="en_transito" {% if paquete.estado_rastreo == 'en_transito' %}selected{% endif %}>🚢/✈️ En tránsito</option>
                    <option value="listo_para_retirar" {% if paquete.estado_rastreo == 'listo_para_retirar' %}selected{% endif %}>✅ Listo para retirar</option>
                </select>
            </div>

            <!-- Costo calculado -->
            <div id="costoPreview" style="display:none;margin-bottom:20px;">
                <div style="background:rgba(45,212,191,0.08);border:1px solid rgba(45,212,191,0.25);border-radius:10px;padding:16px;display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <div style="font-size:12px;color:var(--text-muted);">COSTO CALCULADO</div>
                        <div style="font-size:11px;color:var(--text-muted);margin-top:2px;" id="costoFormula"></div>
                    </div>
                    <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--success);" id="costoValor">$0.00</div>
                </div>
            </div>

            <div style="display:flex;gap:12px;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Actualizar
                </button>
                <a href="{{ url_for('paquetes.index') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function calcularCosto() {
    const peso = parseFloat(document.getElementById('peso').value) || 0;
    const tipo = document.getElementById('tipo_envio').value;
    const selectCliente = document.querySelector('select[name="cliente_id"]');
    const cliente_id = selectCliente ? selectCliente.value : null;
    const preview = document.getElementById('costoPreview');

    if (peso > 0 && tipo) {
        let url = `{{ url_for('paquetes.calcular_costo') }}?peso=${peso}&tipo=${tipo}`;
        if (cliente_id) url += `&cliente_id=${cliente_id}`;
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                document.getElementById('costoValor').textContent = '$' + data.costo.toFixed(2);
                document.getElementById('costoFormula').textContent =
                    `${peso.toFixed(2)} lb × $${data.tarifa.toFixed(2)} = $${data.costo.toFixed(2)}`;
                preview.style.display = 'block';
            })
            .catch(error => {
                console.error("Error calculando costo:", error);
            });
    } else {
        preview.style.display = 'none';
    }
}

document.getElementById('peso').addEventListener('input', calcularCosto);
document.getElementById('tipo_envio').addEventListener('change', calcularCosto);

const selCliente = document.querySelector('select[name="cliente_id"]');

function actualizarTextosTarifa() {
    const cliente_id = selCliente ? selCliente.value : null;
    let url = `{{ url_for('paquetes.tarifas_cliente') }}`;
    if (cliente_id) url += `?cliente_id=${cliente_id}`;
    
    fetch(url)
        .then(res => res.json())
        .then(data => {
            const optAereo = document.getElementById('opt_aereo');
            const optMaritimo = document.getElementById('opt_maritimo');
            
            if(optAereo) optAereo.textContent = `✈️ Aéreo — $${data.aereo.toFixed(2)}/lb`;
            if(optMaritimo) optMaritimo.textContent = `🚢 Marítimo — $${data.maritimo.toFixed(2)}/lb`;
            
            calcularCosto();
        });
}

if (selCliente) selCliente.addEventListener('change', actualizarTextosTarifa);
actualizarTextosTarifa(); // run on load
</script>
{% endblock %}
