{% extends "base.html" %}
{% block title %}Recuperar Contraseña - BJJ SYSTEM{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 65vh;">
    <div class="card" style="width: 100%; max-width: 420px; border-top: 4px solid var(--accent); padding: 40px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-family: 'Syne', sans-serif; color: var(--accent); margin-bottom: 8px; font-size: 24px;">
                Recuperar Contraseña</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Ingresa tu nombre de usuario para recibir un enlace de recuperación.</p>
        </div>

        <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Nombre de Usuario</label>
                <div style="position: relative;">
                    <i class="fas fa-user"
                        style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" name="username" class="form-control" style="padding-left: 40px;"
                        placeholder="Tu usuario" required autofocus>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label>Número de WhatsApp</label>
                <div style="position: relative;">
                    <i class="fab fa-whatsapp"
                        style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="tel" name="telefono" class="form-control" style="padding-left: 40px;"
                        placeholder="Ej: 88888888" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary"
                style="width: 100%; justify-content: center; padding: 12px; font-size: 16px;">
                <i class="fas fa-paper-plane"></i> Enviar Enlace
            </button>
            <div style="text-align: center; margin-top: 15px;">
                <a href="{{ url_for('auth.login') }}" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">
                    <i class="fas fa-arrow-left"></i> Volver al Login
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
